name: Daily CVE Scan

# Rebuilds the server image from scratch every day and scans it with Trivy,
# so new CVEs in the base image or dependencies show up without waiting for a
# code change. No E2E test - vulnerabilities only.

on:
  schedule:
    - cron: '0 4 * * *'   # Every day 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Same group as the Validation Workflow: both use the one self-hosted runner
# and the clean-up jobs remove every container, so runs must not overlap.
concurrency:
  group: self-hosted-validation
  cancel-in-progress: false

jobs:
  pre-clean-up:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v7
    - name: Stop all running Docker containers
      run: |
        echo "Fetching list of all running Docker containers..."
        docker ps --format "{{.Names}}" | while read -r container; do
            if [ -n "$container" ]; then
                echo "Attempting to stop container: $container"
                if docker stop "$container" 2>/dev/null; then
                    echo "✓ Successfully stopped: $container"
                else
                    echo "✗ Failed to stop (skipping): $container"
                fi
            fi
        done
        
        echo ""
        echo "Stop complete. Remaining running containers:"
        docker ps

    - name: Removing stopped containers
      run: |
        echo ""
        echo "Removing all stopped containers..."
        docker ps -a --format "{{.Names}}" | while read -r container; do
            if [ -n "$container" ]; then
                echo "Attempting to remove container: $container"
                if docker rm "$container" 2>/dev/null; then
                    echo "✓ Successfully removed: $container"
                else
                    echo "✗ Failed to remove (skipping): $container"
                fi
            fi
        done
        
        echo ""
        echo "Cleanup complete. Remaining containers:"
        docker ps -a

    - name: Remove all Docker images
      run: |
        echo "Fetching list of all Docker images..."
        docker images --format "{{.Repository}}:{{.Tag}}" | while read -r image; do
            if [ "$image" != "<none>:<none>" ]; then
                echo "Attempting to remove image: $image"
                if docker rmi -f "$image" 2>/dev/null; then
                    echo "✓ Successfully removed: $image"
                else
                    echo "✗ Failed to remove (skipping): $image"
                fi
            fi
        done
        
        # Clean up dangling images separately
        echo "Removing dangling images..."
        docker images --filter "dangling=true" -q | while read -r image_id; do
            if [ -n "$image_id" ]; then
                echo "Attempting to remove dangling image: $image_id"
                docker rmi -f "$image_id" 2>/dev/null || echo "✗ Failed to remove (skipping): $image_id"
            fi
        done
        
        echo ""
        echo "Cleanup complete. Remaining images:"
        docker images

    - name: Remove all Docker networks and volumes
      run: |
        echo "=== Removing Docker Networks ==="
        echo "Fetching list of all Docker networks..."
        docker network ls --format "{{.Name}}" | while read -r network; do
            # Skip default networks that cannot be removed
            if [ "$network" != "bridge" ] && [ "$network" != "host" ] && [ "$network" != "none" ]; then
                echo "Attempting to remove network: $network"
                if docker network rm "$network" 2>/dev/null; then
                    echo "✓ Successfully removed network: $network"
                else
                    echo "✗ Failed to remove network (skipping): $network"
                fi
            else
                echo "⊘ Skipping default network: $network"
            fi
        done
        
        echo ""
        echo "Remaining networks:"
        docker network ls
        echo ""

        echo "=== Removing Docker Volumes ==="
        echo "Fetching list of all Docker volumes..."
        docker volume ls --format "{{.Name}}" | while read -r volume; do
            if [ -n "$volume" ]; then
                echo "Attempting to remove volume: $volume"
                if docker volume rm "$volume" 2>/dev/null; then
                    echo "✓ Successfully removed volume: $volume"
                else
                    echo "✗ Failed to remove volume (skipping): $volume"
                fi
            fi
        done

        # Catch anything the loop missed. Since Docker 23, `volume prune` only
        # removes anonymous volumes unless --all is given; fall back for older
        # engines that do not know the flag.
        echo "Pruning all unused volumes..."
        docker volume prune --all --force 2>/dev/null || docker volume prune --force

        echo ""
        echo "Remaining volumes:"
        docker volume ls

    - name: Prune old images and Trivy cache
      run: |
        echo "Pruning images older than 24h..."
        docker image prune -f

        echo "Removing trivy-cache volume..."
        docker volume rm trivy-cache 2>/dev/null || echo "⊘ trivy-cache volume not present (skipping)"

  BUILD-openvpn-cve-image:
    runs-on: self-hosted
    needs: pre-clean-up
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: |
        docker build --no-cache -t openvpn-cve:latest -f ./server/openvpn.dockerfile .

  TEST-trivy-vulnerability-scan:
    runs-on: self-hosted
    needs: BUILD-openvpn-cve-image
    env:
      # :latest = newest Trivy release; :canary = nightly build from main
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:latest
    steps:
    - uses: actions/checkout@v7
    - name: Pull latest Trivy image
      run: |
        docker pull "$TRIVY_IMAGE"
        docker run --rm "$TRIVY_IMAGE" --version
    - name: Run Trivy vulnerability scanner
      run: |
        set +e
        # Trivy reads the locally built image through the Docker socket. The
        # report goes to stdout and is written by the runner user, so no
        # root-owned files are left in the workspace.
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$PWD/.trivyignore:/trivyignore:ro" \
          -v trivy-cache:/root/.cache/trivy \
          "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL \
            --ignorefile /trivyignore \
            --exit-code 1 \
            --no-progress \
            --format table \
            openvpn-cve:latest > trivy-report.txt
        rc=$?
        cat trivy-report.txt
        {
          echo "## Trivy scan (HIGH, CRITICAL) - $(docker run --rm "$TRIVY_IMAGE" --version | head -1)"
          if [ "$rc" -eq 0 ]; then echo "No unignored vulnerabilities found."; fi
          echo '```'
          cat trivy-report.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

  post-clean-up:
    runs-on: self-hosted
    if: always()
    needs: TEST-trivy-vulnerability-scan

    steps:
    - uses: actions/checkout@v7
    - name: Stop all running Docker containers
      run: |
        echo "Fetching list of all running Docker containers..."
        docker ps --format "{{.Names}}" | while read -r container; do
            if [ -n "$container" ]; then
                echo "Attempting to stop container: $container"
                if docker stop "$container" 2>/dev/null; then
                    echo "✓ Successfully stopped: $container"
                else
                    echo "✗ Failed to stop (skipping): $container"
                fi
            fi
        done
        
        echo ""
        echo "Stop complete. Remaining running containers:"
        docker ps

    - name: Removing stopped containers
      run: |
        echo ""
        echo "Removing all stopped containers..."
        docker ps -a --format "{{.Names}}" | while read -r container; do
            if [ -n "$container" ]; then
                echo "Attempting to remove container: $container"
                if docker rm "$container" 2>/dev/null; then
                    echo "✓ Successfully removed: $container"
                else
                    echo "✗ Failed to remove (skipping): $container"
                fi
            fi
        done
        
        echo ""
        echo "Cleanup complete. Remaining containers:"
        docker ps -a

    - name: Remove all Docker images
      run: |
        echo "Fetching list of all Docker images..."
        docker images --format "{{.Repository}}:{{.Tag}}" | while read -r image; do
            if [ "$image" != "<none>:<none>" ]; then
                echo "Attempting to remove image: $image"
                if docker rmi -f "$image" 2>/dev/null; then
                    echo "✓ Successfully removed: $image"
                else
                    echo "✗ Failed to remove (skipping): $image"
                fi
            fi
        done
        
        # Clean up dangling images separately
        echo "Removing dangling images..."
        docker images --filter "dangling=true" -q | while read -r image_id; do
            if [ -n "$image_id" ]; then
                echo "Attempting to remove dangling image: $image_id"
                docker rmi -f "$image_id" 2>/dev/null || echo "✗ Failed to remove (skipping): $image_id"
            fi
        done
        
        echo ""
        echo "Cleanup complete. Remaining images:"
        docker images

    - name: Remove all Docker networks and volumes
      run: |
        echo "=== Removing Docker Networks ==="
        echo "Fetching list of all Docker networks..."
        docker network ls --format "{{.Name}}" | while read -r network; do
            # Skip default networks that cannot be removed
            if [ "$network" != "bridge" ] && [ "$network" != "host" ] && [ "$network" != "none" ]; then
                echo "Attempting to remove network: $network"
                if docker network rm "$network" 2>/dev/null; then
                    echo "✓ Successfully removed network: $network"
                else
                    echo "✗ Failed to remove network (skipping): $network"
                fi
            else
                echo "⊘ Skipping default network: $network"
            fi
        done
        
        echo ""
        echo "Remaining networks:"
        docker network ls
        echo ""

        echo "=== Removing Docker Volumes ==="
        echo "Fetching list of all Docker volumes..."
        docker volume ls --format "{{.Name}}" | while read -r volume; do
            if [ -n "$volume" ]; then
                echo "Attempting to remove volume: $volume"
                if docker volume rm "$volume" 2>/dev/null; then
                    echo "✓ Successfully removed volume: $volume"
                else
                    echo "✗ Failed to remove volume (skipping): $volume"
                fi
            fi
        done

        # Catch anything the loop missed. Since Docker 23, `volume prune` only
        # removes anonymous volumes unless --all is given; fall back for older
        # engines that do not know the flag.
        echo "Pruning all unused volumes..."
        docker volume prune --all --force 2>/dev/null || docker volume prune --force

        echo ""
        echo "Remaining volumes:"
        docker volume ls

    - name: Prune old images and Trivy cache
      run: |
        echo "Pruning images older than 24h..."
        docker image prune -f

        echo "Removing trivy-cache volume..."
        docker volume rm trivy-cache 2>/dev/null || echo "⊘ trivy-cache volume not present (skipping)"
